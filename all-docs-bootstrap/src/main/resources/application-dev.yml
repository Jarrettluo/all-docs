server:
  port: 8082

spring:
  servlet:
    multipart:
      max-file-size: 300MB
      max-request-size: 500MB

  # 开发环境 MySQL
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:192.168.1.29}:${MYSQL_PORT:5455}/${MYSQL_DATABASE:all_docs}?useSSL=false&serverTimezone=UTC&characterEncoding=utf8mb4
    username: root
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  # 开发环境 Redis（新版 Spring Boot 格式）
  data:
    redis:
      database: 0
      host: ${REDIS_HOST:192.168.1.29}
      port: ${REDIS_PORT:16379}
      password: ${REDIS_PWD:}
      timeout: 3000
      jedis:
        pool:
          max-idle: 100
          min-idle: 10
          max-active: 200
          max-wait: 3000

  thymeleaf:
    cache: false

  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

logging:
  level:
    root: INFO

# 开发环境 Elasticsearch
cloud:
  elasticsearch:
    host: ${ES_HOST:192.168.1.29}
    port: ${ES_PORT:1200}

# 开发环境 MinIO
minio:
  endpoint: ${MINIO_ENDPOINT:http://192.168.1.29:9000}
  access-key: ${MINIO_ACCESS_KEY:rag_flow}
  secret-key: ${MINIO_SECRET_KEY:infini_rag_flow}
  bucket: ${MINIO_BUCKET:all-docs-bucket}
  url-expiration: 3600

# 存储策略
storage:
  type: minio

# 开发环境配置开关（环境变量控制）
all-docs:
  config:
    user-upload: ${AD_USER_UPLOAD:true}
    admin-review: ${AD_ADMIN_REVIEW:false}
    prohibited-word: ${AD_PROHIBITED_WORD:false}
    user-registry: ${AD_USER_REGISTRY:true}
    initial-username: ${AD_INITIAL_USERNAME:admin}
    initial-password: ${AD_INITIAL_PASSWORD:admin123}
    cover-admin: ${COVER_ADMIN:false}
  file-path:
    sensitive-file: sensitive.txt

# 异步线程池
async:
  core-pool-size: 5
  max-pool-size: 20
  queue-capacity: 100
  keep-alive-seconds: 30
