# HTTP 状态码
error-code.not-found=资源未找到
error-code.bad-request=请求参数无效
error-code.unauthorized=未经授权的访问
error-code.forbidden=访问被禁止
error-code.internal-server-error=服务器内部错误

# 用户相关
error-code.user-not-found=用户未找到
error-code.invalid-credentials=无效的凭据
error-code.email-already-exists=邮箱已存在
error-code.username-already-exists=用户名已存在
error-code.user-disabled=用户账户已被禁用
error-code.account-locked=账户已锁定，直到 {0}
error-code.password-expired=密码已过期 {0} 天
error-code.invalid-password=无效密码

# 文件相关
error-code.file-not-found=文件未找到
error-code.file-upload-failed=文件上传失败
error-code.file-download-failed=文件下载失败
error-code.file-delete-failed=文件删除失败
error-code.file-size-exceeded=文件大小超过限制: {0}MB
error-code.invalid-file-type=无效的文件类型: {0}。允许的类型: {1}
error-code.storage-quota-exceeded=存储配额已满

# 文档相关
error-code.document-not-found=文档未找到
error-code.document-update-failed=文档更新失败
error-code.document-delete-failed=文档删除失败
error-code.document-version-conflict=文档版本冲突。当前版本: {0}, 提交版本: {1}

# 团队相关
error-code.team-not-found=团队未找到
error-code.team-member-exists=团队成员已存在
error-code.team-member-not-found=团队成员未找到
error-code.team-quota-exceeded=团队配额已满。最大允许: {0}

# 组织相关
error-code.organization-not-found=组织未找到
error-code.organization-member-exists=用户 {0} 已在组织中存在
error-code.organization-member-not-found=组织成员未找到

# 权限相关
error-code.permission-denied=权限被拒绝
error-code.invalid-permission=无效权限
error-code.role-not-found=角色未找到

# 分类和标签相关
error-code.category-not-found=分类未找到
error-code.tag-not-found=标签未找到
error-code.category-exists=分类已存在
error-code.tag-exists=标签已存在

# 评论相关
error-code.comment-not-found=评论未找到
error-code.comment-delete-failed=评论删除失败

# 系统配置
error-code.config-not-found=配置未找到
error-code.config-update-failed=配置更新失败