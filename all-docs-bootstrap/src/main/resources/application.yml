server:
  port: 8082

spring:
  application:
    name: all-docs
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 300MB
      max-request-size: 500MB

  thymeleaf:
    mode: HTML

  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

# 公共配置（各环境通用）
all-docs:
  file-path:
    sensitive-file: sensitive.txt
