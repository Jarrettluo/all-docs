# HTTP 상태 코드
error-code.not-found=리소스를 찾을 수 없음
error-code.bad-request=잘못된 요청 매개변수
error-code.unauthorized=권한 없음
error-code.forbidden=접근 금지
error-code.internal-server-error=서버 내부 오류

