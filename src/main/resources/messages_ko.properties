error-code.username-already-exists=사용자 이름이 이미 존재함
error-code.user-disabled=사용자 계정이 비활성화됨
error-code.account-locked=계정이 {0}까지 잠김
error-code.password-expired=비밀번호가 {0}일 전에 만료됨
